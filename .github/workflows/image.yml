name: image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight image build for the same ref.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # PRs from forks cannot push to GHCR or sign with OIDC; build only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build date
        id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build (and push) multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Push only on main pushes (and on workflow_dispatch),
          # never on PR builds from forks.
          push: ${{ github.event_name != 'pull_request' }}
          # Tags are written as a YAML literal multiline string.
          # Earlier revisions wrote them via `echo "tags=..." >>
          # $GITHUB_OUTPUT` which made GitHub Actions concatenate
          # repeated `tags=` writes with commas, so the action
          # treated the whole list as a single tag name — and only
          # the last value survived. Inlining the list here is the
          # common pattern (matches e.g. docker/build-push-action's
          # own examples).
          tags: |
            ghcr.io/therealchickenlegs/dockpulse:latest
            ghcr.io/therealchickenlegs/dockpulse:edge
            ghcr.io/therealchickenlegs/dockpulse:edge-${{ github.sha }}
            ghcr.io/therealchickenlegs/dockpulse:main-${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless OIDC)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: '1'
        # Sign by digest so we never sign a tag that the registry
        # hasn't yet propagated. The published tags (latest, edge,
        # edge-<sha>, main-<sha>) all point to the same digest so a
        # single signature covers all of them.
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "Signing digest ${DIGEST}"
          cosign sign --yes "ghcr.io/therealchickenlegs/dockpulse@${DIGEST}"
