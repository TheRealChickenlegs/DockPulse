name: image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight image build for the same ref.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  # Required by actions/attest-build-provenance to record the
  # SLSA provenance statement in GitHub's Attestations API.
  attestations: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # PRs from forks cannot push to GHCR or record attestations; build only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build date
        id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build (and push) multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Push only on main pushes (and on workflow_dispatch),
          # never on PR builds from forks.
          push: ${{ github.event_name != 'pull_request' }}
          # Only two moving tags: latest is the stable pointer, edge
          # is the newest build. Per-commit sha tags were dropped so
          # the GHCR tag list stops accumulating (latest+edge share a
          # digest, so they appear as one version in the UI). Tags
          # are inlined as a YAML literal so the action receives a
          # real list rather than a comma-joined single tag.
          tags: |
            ghcr.io/therealchickenlegs/dockpulse:latest
            ghcr.io/therealchickenlegs/dockpulse:edge
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SLSA provenance via GitHub's Attestations API. This replaces
      # cosign: GHCR does not implement the OCI Referrers API, so
      # cosign had to store signatures as sha256-<digest>.sig tags
      # which cluttered the package listing. attest-build-provenance
      # records the provenance with GitHub instead — visible on the
      # release/package page but never as a registry tag.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/therealchickenlegs/dockpulse
          subject-digest: ${{ steps.build.outputs.digest }}
