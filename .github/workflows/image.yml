name: image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight image build for the same ref.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # PRs from forks cannot push to GHCR or sign with OIDC; build only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=ghcr.io/therealchickenlegs/dockpulse:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=ghcr.io/therealchickenlegs/dockpulse:edge" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/therealchickenlegs/dockpulse:edge-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/therealchickenlegs/dockpulse:main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/therealchickenlegs/dockpulse:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push) multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: steps.meta.outputs.push == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless OIDC)
        if: steps.meta.outputs.push == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ghcr.io/therealchickenlegs/dockpulse:edge
          cosign sign --yes ghcr.io/therealchickenlegs/dockpulse:edge-${SHORT_SHA}
          cosign sign --yes ghcr.io/therealchickenlegs/dockpulse:main-${SHORT_SHA}