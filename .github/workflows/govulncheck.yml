name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Run govulncheck
        working-directory: go
        # govulncheck is pinned to v1.1.4 because the latest version
        # (v1.6.0+) requires Go >= 1.25. The runner uses Go 1.26 so
        # the toolchain constraint is satisfied; bump the pin when
        # you also want the latest govulncheck features.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
