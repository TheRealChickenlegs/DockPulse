# DockPulse controller (default stack).
#
# This file is the **default** deployment: the controller runs on a
# private Docker network and is reached via the operator's existing
# reverse proxy (nginx proxy manager, Traefik, Caddy, etc.). It does
# NOT include a bundled reverse proxy.
#
# If you don't already run a reverse proxy, use the alternative
# `docker-compose.with-caddy.yml` file which bundles Caddy with
# automatic HTTPS.
#
# Usage:
#   1. Copy `.env.example` to `.env` and edit values as needed.
#   2. Choose EITHER a named volume (default — works out of the box)
#      OR a bind mount by commenting/uncommenting the volumes block
#      below. The container runs as UID 1000:1000, which matches
#      the typical homelab host UID, so bind mounts from your
#      regular user-owned directory work without `sudo chown`.
#   3. Place the controller on a network your reverse proxy can reach
#      (the included `proxy` network is used by default).
#   4. Point your reverse proxy at `controller:9787` and apply the
#      security headers documented in deploy/README.md.
#   5. docker compose -f deploy/docker-compose.yml up -d

name: dockpulse

services:
  controller:
    image: ghcr.io/therealchickenlegs/dockpulse:${DOCKPULSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    # The image runs as UID 1000:1000 by default — the typical
    # homelab host UID. Bind mounts from the host's user-owned
    # directory work without chown. Override here if your host
    # uses a different UID.
    user: "1000:1000"
    command:
      - "--mode=controller"
      - "--listen=:9787"
      - "--db=/data/dockpulse.db"
    environment:
      DOCKPULSE_LOG_LEVEL: ${DOCKPULSE_LOG_LEVEL:-info}
      DOCKPULSE_LOG_FORMAT: json
      # Set this to a comma-separated list of trusted reverse-proxy IPs
      # (CIDR or single address) so chi's RealIP middleware only
      # honours X-Forwarded-For from a known source. Leave empty in
      # dev; set to your reverse-proxy address in production.
      DOCKPULSE_TRUSTED_PROXIES: ${DOCKPULSE_TRUSTED_PROXIES:-}
    volumes:
      # ---- Named volume (default) ----
      # Docker manages the directory and sets the right permissions.
      - controller_data:/data
      # ---- Bind mount (uncomment to use) ----
      # - /path/to/dockpulse-data:/data
      # The host directory must be writable by UID 1000 (or the
      # override you set above). On most homelab hosts this is true
      # out of the box because /home/<you>/dockpulse-data is owned
      # by UID 1000.
    networks:
      - proxy
    # Expose the controller on the host's docker network only. The
    # operator's reverse proxy joins the `proxy` network and proxies
    # to controller:9787. Uncomment to also publish on the host for
    # direct access (debugging only — never expose 9787 publicly).
    # ports:
    #   - "127.0.0.1:9787:9787"
    healthcheck:
      test: ["CMD", "/usr/local/bin/dockpulse", "--mode=controller", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  proxy:
    # The operator's reverse proxy joins this network and proxies to
    # controller:9787. This is intentionally an external network so
    # it can be created once and shared with the reverse proxy.
    name: ${DOCKPULSE_PROXY_NETWORK:-dockpulse_proxy}

volumes:
  controller_data: