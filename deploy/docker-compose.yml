# DockPulse controller (default stack).
#
# This file is the **default** deployment: the controller runs on a
# private Docker network and is reached via the operator's existing
# reverse proxy (nginx proxy manager, Traefik, Caddy, etc.). It does
# NOT include a bundled reverse proxy.
#
# If you don't already run a reverse proxy, use the alternative
# `docker-compose.with-caddy.yml` file which bundles Caddy with
# automatic HTTPS.
#
# Usage:
#   1. Copy `.env.example` to `.env` and edit values as needed.
#   2. Place the controller on a network your reverse proxy can reach
#      (the included `proxy` network is used by default).
#   3. Point your reverse proxy at `controller:8080` and apply the
#      security headers documented in deploy/README.md.
#   4. docker compose -f deploy/docker-compose.yml up -d

name: dockpulse

services:
  controller:
    image: ghcr.io/therealchickenlegs/dockpulse:${DOCKPULSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
      - "--mode=controller"
      - "--listen=:8080"
      - "--db=/data/dockpulse.db"
    environment:
      DOCKPULSE_LOG_LEVEL: ${DOCKPULSE_LOG_LEVEL:-info}
      DOCKPULSE_LOG_FORMAT: json
      # Set this to a comma-separated list of trusted reverse-proxy IPs
      # (CIDR or single address) so chi's RealIP middleware only
      # honours X-Forwarded-For from a known source. Leave empty in
      # dev; set to your reverse-proxy address in production.
      DOCKPULSE_TRUSTED_PROXIES: ${DOCKPULSE_TRUSTED_PROXIES:-}
    volumes:
      - controller_data:/data
    networks:
      - proxy
    # Expose the controller on the host's docker network only. The
    # operator's reverse proxy joins the `proxy` network and proxies
    # to controller:8080. Uncomment to also publish on the host for
    # direct access (debugging only — never expose 8080 publicly).
    # ports:
    #   - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/dockpulse", "--mode=controller", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  proxy:
    # The operator's reverse proxy joins this network and proxies to
    # controller:8080. This is intentionally an external network so
    # it can be created once and shared with the reverse proxy.
    name: ${DOCKPULSE_PROXY_NETWORK:-dockpulse_proxy}

volumes:
  controller_data: