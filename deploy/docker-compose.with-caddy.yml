# DockPulse controller with the bundled Caddy reverse proxy.
#
# Use this file ONLY if you don't already run a reverse proxy (such
# as nginx proxy manager, Traefik, or your own Caddy). It bundles
# Caddy with automatic HTTPS via Let's Encrypt so a single command
# is enough to get a TLS-fronted controller.
#
# If you already have a reverse proxy, use `docker-compose.yml`
# instead and point it at the controller container.
#
# Usage:
#   1. Copy `.env.example` to `.env` and set DOCKPULSE_DOMAIN +
#      DOCKPULSE_ACME_EMAIL at minimum.
#   2. Make sure DNS for $DOCKPULSE_DOMAIN points at this host and
#      ports 80/443 are reachable from the internet.
#   3. docker compose -f deploy/docker-compose.with-caddy.yml up -d

name: dockpulse

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOCKPULSE_DOMAIN: ${DOCKPULSE_DOMAIN:?Set DOCKPULSE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      controller:
        condition: service_healthy
    networks: [frontend, backend]

  controller:
    image: ghcr.io/therealchickenlegs/dockpulse:${DOCKPULSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    command:
      - "--mode=controller"
      - "--listen=:9787"
      - "--db=/data/dockpulse.db"
    environment:
      DOCKPULSE_LOG_LEVEL: ${DOCKPULSE_LOG_LEVEL:-info}
      DOCKPULSE_LOG_FORMAT: json
    volumes:
      - controller_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "/usr/local/bin/dockpulse", "--mode=controller", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  frontend:
  backend:

volumes:
  controller_data:
  caddy_data:
  caddy_config: